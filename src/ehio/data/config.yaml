EHI_AMR_BATCH_DATE: "fldI1EGvr6q4rM8cw"  # Field in EHI_AMR_BATCH with the batch date (for logging)
EHI_AMR_BATCH_STATUS: "fld8oKt3drlQKJS5R"  # Field in EHI_AMR_BATCH with the batch status (for scanning, processing and logging)
EHI_AMR_BATCH_LIST_ASSEMBLIES: "fldQ7fIUgGwv84loo"  # Field in EHI_AMR_BATCH with the linked assembly records, i.e. a list of EHI_ASB_ENTRY_ID (for processing)
