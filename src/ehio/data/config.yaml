# Reference genome indexing.
# A batch whose genome has no EHI_GENOME_URL_INDEXED runs with drakkar -r, which
# rebuilds the Bowtie2 index from the raw FASTA. 'ehio preprocessing --output'
# archives that index, uploads it to {SFTP_REMOTE_BASE}/{SFTP_REMOTE_REFERENCE_DIR}/{code}.tar.gz
# and flags the genome as indexed, so every later batch on the same host uses -x.
# The flag lives in the master reference genome table, which is in its own base.
SFTP_REMOTE_REFERENCE_DIR: "GEN"  # Subfolder of SFTP_REMOTE_BASE holding the indexed genomes
EHI_GENOME_INDEX_BASE: "app6ADWyLxBkDcqYX"   # Base holding the master reference genome table
EHI_GENOME_INDEX_TABLE: "tbl1t5vnst50DjT9A"  # Master reference genome table (writable)
EHI_GENOME_INDEX_CODE: "Code"                # Field (id or name) in that table with the genome code, used to find the record
EHI_GENOME_INDEXED: "fldLbMhCwARPB131W"      # Field in that table set once the index is on ERDA
EHI_GENOME_INDEXED_VALUE: "YES"              # Value written to EHI_GENOME_INDEXED

