# ---- AMR module -----------------------------------------------------------
# Input:  fetch the assemblies linked to an AMR batch, download their FASTAs,
#         and write a drakkar amr assembly manifest
# Output: parse amr/amr_qc.tsv, write the per-assembly AMR stats back to
#         EHI_ASB_ENTRY, transfer the aggregate tables to AMR/{batch} and
#         attach them to the AMR batch record
#
# The AMR batch table lives in EHI_BASE and links to the assembly entries of
# EHI_ASB_ENTRY, so an assembly can be run through the AMR workflow long after
# the binning batch that produced it is done.

